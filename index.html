
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Traffic Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d16;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{position:relative;width:min(100vw,430px);height:100dvh;margin:auto;overflow:hidden;background:#10251f;touch-action:none}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{background:#08111ddd;border:1px solid #344b60;border-radius:12px;padding:9px 12px}
.small{font-size:11px;color:#8da9be;letter-spacing:1px}
.number{font-size:22px;font-weight:bold}
#pause{pointer-events:auto;color:white;background:#182a3b;border:1px solid #547086;border-radius:10px;padding:10px 13px;font-size:18px}
.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.ctrl{pointer-events:auto;width:82px;height:72px;border-radius:18px;background:#18354bcc;border:2px solid #5b91ac;color:white;font-size:32px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl.active{background:#30a9a0;transform:scale(.96)}
.overlay{position:absolute;inset:0;background:#06101bdc;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{width:100%;background:#102235;border:1px solid #3d6078;border-radius:20px;padding:26px 20px}
h1{font-size:32px;margin:0 0 8px}
.subtitle{color:#8db3ca;font-size:13px;margin-bottom:22px}
.action{width:100%;border:0;border-radius:12px;padding:15px;margin-top:9px;background:#22a99b;color:white;font-size:16px;font-weight:bold}
.secondary{background:#243d52}
.hidden{display:none}
.help{font-size:12px;color:#91aabd;line-height:1.6;margin-top:17px}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div class="hud">
<div class="panel"><div class="small">DISTANCE</div><div class="number" id="score">0</div></div>
<div class="panel"><div class="small">BEST</div><div class="number" id="best">0</div></div>
<button id="pause">Ⅱ</button>
</div>
<div class="controls">
<button class="ctrl" id="left">◀</button>
<button class="ctrl" id="right">▶</button>
</div>
<div class="overlay" id="menu">
<div class="card">
<h1>TRAFFIC<br>RACING</h1>
<div class="subtitle">ENDLESS HIGHWAY</div>
<button class="action" id="start">START RACING</button>
<div class="help">Удерживай ◀ или ▶ для движения.<br>Избегай машин и масляных пятен!</div>
</div>
</div>
<div class="overlay hidden" id="message">
<div class="card">
<h1 id="messageTitle">PAUSED</h1>
<div class="subtitle" id="messageText">Игра приостановлена</div>
<button class="action" id="resume">CONTINUE</button>
<button class="action secondary" id="restart">RESTART</button>
</div>
</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const game=$('game');
let W=400,H=700,dpr=1;
let running=false,paused=false,over=false;
let playerX=1.5,held=0,playerAngle=0;
let skidTimer=0,skidDir=0,skidCooldown=0;
let roadScroll=0,score=0,best=0,speed=250,spawn=0,oilSpawn=3,last=0;
let traffic=[],oils=[],tireMarks=[];
try{best=Number(localStorage.getItem('trafficBest')||0)}catch(e){}
$('best').textContent=best;

function resize(){
 const r=game.getBoundingClientRect();
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=r.width;H=r.height;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
resize();

function roadWidth(){return Math.min(W*.82,340)}
function leftEdge(){return (W-roadWidth())/2}
function laneWidth(){return roadWidth()/4}
function carX(n){return leftEdge()+laneWidth()*(n+.5)}

function drawCar(x,y,w,h,color,player=false,angle=0){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);
 ctx.fillStyle='#0008';
 ctx.fillRect(-w*.48+3,-h*.45+5,w*.96,h*.95);
 ctx.fillStyle=color;
 ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,w*.22);ctx.fill();
 ctx.fillStyle='#182c3d';
 ctx.beginPath();ctx.roundRect(-w*.34,-h*.29,w*.68,h*.28,w*.08);ctx.fill();
 ctx.fillStyle='#294b61';ctx.fillRect(-w*.32,h*.08,w*.64,h*.20);
 ctx.fillStyle='#e5f6ff';
 ctx.fillRect(-w*.35,-h*.43,w*.22,h*.07);
 ctx.fillRect(w*.13,-h*.43,w*.22,h*.07);
 ctx.fillStyle='#ff5b58';
 ctx.fillRect(-w*.36,h*.36,w*.22,h*.07);
 ctx.fillRect(w*.14,h*.36,w*.22,h*.07);
 ctx.fillStyle='#111820';
 ctx.fillRect(-w*.55,-h*.29,w*.12,h*.22);
 ctx.fillRect(w*.43,-h*.29,w*.12,h*.22);
 ctx.fillRect(-w*.55,h*.15,w*.12,h*.22);
 ctx.fillRect(w*.43,h*.15,w*.12,h*.22);
 if(player){
  ctx.shadowColor='#24e7d1';ctx.shadowBlur=14;
  ctx.strokeStyle='#24e7d1';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,w*.22);ctx.stroke();
 }
 ctx.restore();
}

function drawOil(o){
 ctx.save();
 ctx.translate(carX(o.lane),o.y);
 ctx.rotate(o.angle);
 ctx.fillStyle='#090c10';
 ctx.beginPath();
 ctx.ellipse(0,0,laneWidth()*.31,13,0,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle='#272932';
 ctx.beginPath();
 ctx.ellipse(-2,-2,laneWidth()*.23,8,0,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle='#45404b';
 ctx.beginPath();
 ctx.ellipse(4,1,laneWidth()*.12,4,0,0,Math.PI*2);
 ctx.fill();
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#10251f';ctx.fillRect(0,0,W,H);
 const edge=leftEdge(),rw=roadWidth(),lw=laneWidth();
 ctx.fillStyle='#293640';ctx.fillRect(edge-7,0,rw+14,H);
 ctx.fillStyle='#202a33';ctx.fillRect(edge,0,rw,H);
 ctx.fillStyle='#d4d8d4';
 for(let y=-40+(roadScroll%70);y<H;y+=70){
  ctx.fillRect(edge-5,y,3,35);
  ctx.fillRect(edge+rw+2,y,3,35);
 }
 ctx.fillStyle='#68737b';
 for(let i=1;i<4;i++)
  for(let y=-50+(roadScroll%62);y<H;y+=62)
   ctx.fillRect(edge+lw*i-1,y,2,29);

 // Следы шин постепенно исчезают
 for(const m of tireMarks){
  ctx.globalAlpha=Math.max(0,m.life/1.05)*.55;
  ctx.fillStyle='#090d12';
  ctx.beginPath();
  ctx.ellipse(m.x,m.y,2.2,7,0,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;

 for(const o of oils)drawOil(o);
 for(const c of traffic)
  drawCar(carX(c.lane),c.y,Math.min(lw*.57,43),Math.min(H*.085,64),c.color);

 drawCar(carX(playerX),H*.79,Math.min(lw*.59,44),Math.min(H*.09,68),'#13b9b0',true,playerAngle);

 if(skidTimer>0){
  ctx.save();
  ctx.fillStyle='#ffffff';
  ctx.globalAlpha=.85;
  ctx.font='bold 12px Arial';
  ctx.textAlign='center';
  ctx.fillText('SKID!',W/2,H*.68);
  ctx.restore();
 }
}

function reset(){
 playerX=1.5;held=0;playerAngle=0;
 skidTimer=0;skidDir=0;skidCooldown=0;
 roadScroll=0;score=0;speed=250;spawn=.6;oilSpawn=3;
 traffic=[];oils=[];tireMarks=[];
 running=true;paused=false;over=false;
 $('menu').classList.add('hidden');
 $('message').classList.add('hidden');
 $('score').textContent='0';
 $('resume').classList.remove('hidden');
 last=performance.now();
}

function endGame(){
 running=false;over=true;held=0;
 if(score>best){
  best=score;$('best').textContent=best;
  try{localStorage.setItem('trafficBest',best)}catch(e){}
 }
 $('messageTitle').textContent='GAME OVER';
 $('messageText').textContent='Distance: '+score;
 $('resume').classList.add('hidden');
 $('message').classList.remove('hidden');
}

function togglePause(){
 if(!running||over)return;
 paused=!paused;held=0;
 if(paused){
  $('messageTitle').textContent='PAUSED';
  $('messageText').textContent='Игра приостановлена';
  $('resume').classList.remove('hidden');
  $('message').classList.remove('hidden');
 }else{
  $('message').classList.add('hidden');
 }
 last=performance.now();
}

function bindButton(id,dir){
 const b=$(id);
 function release(){
  held=0;
  b.classList.remove('active');
 }
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!running||paused||over)return;
  held=dir;
  b.classList.add('active');
  try{b.setPointerCapture(e.pointerId)}catch(err){}
 });
 b.addEventListener('pointerup',release);
 b.addEventListener('pointercancel',release);
 b.addEventListener('lostpointercapture',release);
}
bindButton('left',-1);
bindButton('right',1);

$('start').addEventListener('click',reset);
$('restart').addEventListener('click',reset);
$('pause').addEventListener('click',togglePause);
$('resume').addEventListener('click',togglePause);

function update(dt){
 if(!running||paused)return;

 if(skidCooldown>0)skidCooldown-=dt;
 if(skidTimer>0){
  skidTimer-=dt;
  playerX+=skidDir*1.85*dt;
  playerAngle=-skidDir*.62;
 }else{
  playerX+=held*2.3*dt;
  const desiredAngle=-held*.13;
  playerAngle+=(desiredAngle-playerAngle)*(1-Math.exp(-5*dt));
 }
 playerX=Math.max(0,Math.min(3,playerX));

 roadScroll=(roadScroll+speed*dt)%70;
 speed=Math.min(440,250+score*.35);
 spawn-=dt;
 oilSpawn-=dt;

 if(spawn<=0){
  const l=Math.floor(Math.random()*4);
  traffic.push({
   lane:l,y:-80,
   color:['#ed9b48','#a98bf2','#e45c68','#e0dfd2'][Math.floor(Math.random()*4)]
  });
  spawn=Math.max(.48,1.05-score*.003)+Math.random()*.25;
 }

 // Масляные пятна появляются на случайных полосах
 if(oilSpawn<=0){
  oils.push({
   lane:Math.floor(Math.random()*4),
   y:-40,
   angle:Math.random()*1.2-.6
  });
  oilSpawn=4+Math.random()*4;
 }

 const py=H*.79,ph=Math.min(H*.09,68);

 for(let i=traffic.length-1;i>=0;i--){
  const c=traffic[i];c.y+=speed*dt;
  if(c.y>H+90){traffic.splice(i,1);continue}
  if(Math.abs(carX(c.lane)-carX(playerX))<laneWidth()*.48&&Math.abs(c.y-py)<ph*.82){
   endGame();return;
  }
 }

 for(let i=oils.length-1;i>=0;i--){
  const o=oils[i];
  o.y+=speed*dt;
  if(o.y>H+40){oils.splice(i,1);continue}
  const dx=Math.abs(carX(o.lane)-carX(playerX));
  if(dx<laneWidth()*.43&&Math.abs(o.y-py)<19&&skidCooldown<=0){
   skidDir=Math.random()<.5?-1:1;
   skidTimer=1.15;
   skidCooldown=2.2;
   oils.splice(i,1);
  }
 }

 // Следы от задних колёс во время заноса
 if(skidTimer>0){
  const cx=carX(playerX);
  const py2=H*.79;
  tireMarks.push({x:cx-laneWidth()*.16,y:py2+23,life:1.05});
  tireMarks.push({x:cx+laneWidth()*.16,y:py2+23,life:1.05});
 }
 for(let i=tireMarks.length-1;i>=0;i--){
  const m=tireMarks[i];
  m.y+=speed*dt;
  m.life-=dt;
  if(m.life<=0||m.y>H+20)tireMarks.splice(i,1);
 }
 score+=Math.floor(dt*10);
 $('score').textContent=score;
}

function frame(t){
 const dt=Math.min((t-last)/1000||0,.035);
 last=t;
 if(running&&!paused)update(dt);
 draw();
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&running&&!paused)togglePause();
});
requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
</body>
</html>
